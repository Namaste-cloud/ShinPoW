name: Daily Gemini Math Problem Generator

on:
  schedule:
    # 매일 한국시간(KST) 오전 05:30 = UTC 20:30 자동 출제 및 라이브 배포
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      jihoon_basic_level:
        description: '신지훈 기본 난이도 (비우면 data/difficulty.json 사용)'
        required: false
        default: ''
      jihoon_adv_level:
        description: '신지훈 심화 난이도 (비우면 data/difficulty.json 사용)'
        required: false
        default: ''
      leehyun_basic_level:
        description: '신이현 기본 난이도 (비우면 data/difficulty.json 사용)'
        required: false
        default: ''
      leehyun_adv_level:
        description: '신이현 심화 난이도 (비우면 data/difficulty.json 사용)'
        required: false
        default: ''
      topic_hint:
        description: '원하는 단원/테마 힌트 (선택, 예: 지훈 로보틱스, 이현 천문학)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate today's math problems via Gemini Pro API (Jihoon & Leehyun)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JIHOON_BASIC_LEVEL: ${{ inputs.jihoon_basic_level }}
          JIHOON_ADV_LEVEL: ${{ inputs.jihoon_adv_level }}
          LEEHYUN_BASIC_LEVEL: ${{ inputs.leehyun_basic_level }}
          LEEHYUN_ADV_LEVEL: ${{ inputs.leehyun_adv_level }}
          TOPIC_HINT: ${{ inputs.topic_hint }}
        run: node scripts/generate-daily-problems.mjs

      - name: Verify protocol & hashed problem integrity
        run: node --test tests/protocol.test.mjs

      - name: Commit and push updated data/problems.json
        run: |
          git config user.name "ShinPoW Math Bot"
          git config user.email "bot@shinpow.local"
          git add data/problems.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(math): publish daily Gemini math problems"
            git push
          else
            echo "No problem changes to commit."
          fi

  deploy:
    needs: generate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
